[project]
name = "pyfaktory"
version = "0.2.13"
description = "Faktory Client Python (Producer and Consumer/Worker)"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Ghiles Meddour", email = "ghiles.meddour.b@gmail.com" }]
readme = "README.md"
requires-python = ">=3.9,<4.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "Pebble>=5.0.5,<6.0.0",
    "rfc3339-validator>=0.1.4,<0.2.0",
    "pydantic>=2.5.2,<3.0.0",
]

[project.optional-dependencies]
sentry = ["sentry-sdk"]

[project.urls]
Homepage = "https://github.com/ghilesmeddour/faktory_worker_python"
Repository = "https://github.com/ghilesmeddour/faktory_worker_python"
Documentation = "https://github.com/ghilesmeddour/faktory_worker_python"

[dependency-groups]
dev = [
    "ruff>=0.17.3",
    "mypy>=1.7.1",
    "coverage>=7.3.2",
    "vulture>=2.10",
    "pytest>=7.4.3",
    "numpy>=1.26.2",
    "xarray>=2023.12.0",
]

[tool.ruff]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["I"]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
